spring:
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
  ai:
  vectorstore:
    pgvector:
    index-type: HNSW
    distance-type: COSINE_DISTANCE
#    dimensions: 1536
    max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
server:
  port: 8123
  servlet:
    context-path: /api
  # springdoc-openapi ??????
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.dsj.aiagent.controller
# knife4j???????????????

knife4j:
  enable: true
  setting:
    language: zh_cn
logging:
  charset:
    file: UTF-8
    console: UTF-8
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug
